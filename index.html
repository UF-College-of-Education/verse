    <script>
      AFRAME.registerComponent("hover-effect", {
        schema: {
          color: { default: "#24CAFF" },
          initialColor: { default: "#FFF" },
        },

        init: function () {
          const el = this.el;
          const data = this.data;

          el.addEventListener("mouseenter", () => {
            el.setAttribute("material", "color", data.color);
          });

          el.addEventListener("mouseleave", () => {
            el.setAttribute("material", "color", data.initialColor);
          });
        },
      });
    </script>

      <!--Create the camera for the scene, enable fuse for Gaze based interactions-->
      <a-camera id="camera">
        <a-cursor
          raycaster="objects: [data-clickable];"
          fuse="true"
          fuse-timeout="1500"
          id="cursor"
          color="#6BA7FF"
          animation__mouseenter="property: scale; to: 0.1 0.1 0.1; startEvents: mouseenter; dur:1500;"
          animation__mouseleave="property:scale; to: 1 1 1; startEvents: mouseleave; dur:250;"
        ></a-cursor>
      </a-camera>
      <!--Create the sky (for our purposes, the sky is the video, and the limit) for the scene-->
      <a-videosphere
        src="#scene0a"
        id="videoSphere"
        rotation="0 -90 0"
      ></a-videosphere>

      <!--Buttons-->
      <!--Play Button-->
      <a-text
        value="Play"
        id="startButton"
        data-clickable
        position="0 1.0 -3.1"
        align="center"
        onclick="beginExperience()"
        visible="true"
      >
        <a-plane
          color="#426E49"
          id="playPlane"
          material="src: url(https://cdn.glitch.global/2a9c8ea7-e69c-449f-8535-c66daf2cd371/less%20transparent%20frame%2C%208-5.png?v=1680030753877); transparent:true"
          data-clickable
          scale="0.8 0.5 1"
          animation="property:material.color;
          to:#1D615C;
          dur:500;
          startEvents:mouseenter;"
          animation__leave="property:material.color;
          to:#426E49;
          dur:500;
          startEvents:mouseleave;
          "
        >
        </a-plane>
      </a-text>

      <a-text
        value="It's starting to get a little loud"
        id="flavorText"
        position="0 0.7 -3.1"
        wrap-count="100"
        align="center"
        visible="false"
      >
        <a-plane
          color="#426E49"
          id="flavorTextPlane"
          material="src: url(https://cdn.glitch.global/2a9c8ea7-e69c-449f-8535-c66daf2cd371/less%20transparent%20frame%2C%208-5.png?v=1680030753877); transparent:true"

          animation__leave="property:material.color;
          to:#426E49;

          startEvents:mouseleave;

      </a-text>

      <!--Enter Button-->

        value="Enter"
        id="enterButton"
        position="-.7 0.9 -3"
        align="center"
        onclick="enterRestaurant()"
        visible="false"

          color="#426E49"
          scale="0.8 0.5 1"
